mode: rule
log-level: info

dns:
  enable: true
  listen: "127.0.0.1:53"
  enhanced-mode: "fake-ip"
  fake-ip-range: "198.18.0.1/16"
  fake-ip-range6: "fdfe:dcba:9876::1/64"
  fake-ip-filter-mode: "blacklist"
  prefer-h3: false
  respect-rules: true
  use-hosts: false
  use-system-hosts: false
  ipv6: false
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - "time.*.com"
    - "ntp.*.com"
    - "+.market.xiaomi.com"
    - "localhost.ptlogin2.qq.com"
    - "*.msftncsi.com"
    - "www.msftconnecttest.com"
    - "*.ip.sb"
    - "*.ipip.net"
    - "ipwho.is"
    - "*.ipapi.is"
    - "baidu.com"
    - "*.baidu.com"
    - "*.bdimg.com"
    - "+.google.com"
    - "+.google"
    - "+.cloudflare.com"
    - "+.paypal.com"
  default-nameserver:
    - "223.6.6.6"
    - "223.5.5.5"
    - "119.29.29.29"
  nameserver:
    - "https://dns.cloudflare.com/dns-query"
    - "https://doh.pub/dns-query"
    - "https://dns.alidns.com/dns-query"
  nameserver-policy:
    "geosite:cn":
      - "https://doh.pub/dns-query"
      - "https://dns.alidns.com/dns-query"
  direct-nameserver-follow-policy: true
  fallback-filter:
    geoip: true
    geoip-code: "CN"
    ipcidr:
      - "240.0.0.0/4"
      - "0.0.0.0/32"
    domain:
      - "+.google.com"
      - "+.google"
  fallback:
    - "https://dns.google/dns-query"
    - "https://dns.cloudflare.com/dns-query"
  proxy-server-nameserver:
    - "https://dns.cloudflare.com/dns-query"
    - "https://doh.pub/dns-query"
    - "https://dns.alidns.com/dns-query"
  direct-nameserver:
    - "https://doh.pub/dns-query"
    - "https://dns.alidns.com/dns-query"

hosts: {}
