[custom]
enable_rule_generator=true
overwrite_original_rules=true
; 基础模板让 FCM 域名走自建静态 DoH（nameserver-policy），不再同步 hosts
clash_rule_base=https://raw.githubusercontent.com/freebaipiao/clashconfig/codex/clash-base.yml
exclude_remarks=(距离下次重置剩余|套餐到期)

;不要随意改变关键字，否则会导致出错
;acl4SSR规则

;去广告：支持
;自动测速：支持
;微软分流：支持
;苹果分流：支持
;增强中国IP段：支持
;增强国外GFW：支持

;设置规则标志位
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
