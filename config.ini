;=========================
; 倍率节点（互斥优化版）
;=========================

;; 低倍率节点
custom_proxy_group=🟦 低倍率节点`select`(^|[^0-9A-Za-z.])(0(\.[0-9]+)[xX倍]?|0[xX]|free|Free|FREE|免费)($|[^0-9A-Za-z.])

; 普通倍率节点（只有 1.0x）
custom_proxy_group=🟩 普通倍率节点`select`(^|[^0-9A-Za-z.])(1(\.0+)[xX倍]?|1[xX倍])($|[^0-9A-Za-z.])

; 高倍率节点（>1.0x）
custom_proxy_group=🟥 高倍率节点`select`(^|[^0-9A-Za-z.])((1\.[1-9][0-9]*|[2-9]\.[0-9]+|[1-9][0-9]+\.[0-9]+|[2-9][0-9]*|[1-9][0-9]+)([xX]|倍))($|[^0-9A-Za-z.])


